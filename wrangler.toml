# Cloudflare deployment. The Worker serves the built game from dist and relays
# multiplayer through one Durable Object per room.
#
#   npm run build
#   npx wrangler deploy
name = "aegis-and-dominion"
main = "server/worker.ts"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
