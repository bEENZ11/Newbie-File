# Cloudflare deployment. The Worker serves the game, which is packed into it at
# build time, and relays multiplayer through one Durable Object per room.
#
#   npm run deploy
name = "aegis-and-dominion"
main = "server/worker.ts"
compatibility_date = "2026-01-01"

# The game's files are bundled in as raw data.
[[rules]]
type = "Data"
globs = ["**/*.bin"]
fallthrough = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomObject"]
