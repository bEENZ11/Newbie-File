<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RTS Prototype</title>
    <style>
      :root {
        --sidebar: 236px;
        --gold: #f0c14b;
        --panel: #171b1f;
        --line: rgba(255, 255, 255, 0.12);
        --muted: #93a0aa;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0e1012;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #e8ecef;
        user-select: none;
      }
      /* Darkened corners draw the eye to the middle of the battlefield. */
      #vignette {
        position: fixed;
        left: 0;
        top: 0;
        width: calc(100vw - var(--sidebar));
        height: 100vh;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 58%, rgba(0, 0, 0, 0.34) 100%);
      }
      #game {
        display: block;
        width: calc(100vw - var(--sidebar));
        height: 100vh;
        cursor: crosshair;
      }
      body[data-mode='placing'] #game {
        cursor: copy;
      }
      body[data-mode='sell'] #game,
      body[data-mode='repair'] #game {
        cursor: pointer;
      }
      #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: var(--sidebar);
        height: 100vh;
        box-sizing: border-box;
        padding: 14px 12px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
      }
      #minimap {
        width: 184px;
        height: 184px;
        flex: none;
        align-self: center;
        background: #000;
        border: 1px solid var(--line);
        border-radius: 3px;
        image-rendering: pixelated;
        cursor: pointer;
      }
      .label {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #credits {
        font-size: 22px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        color: var(--gold);
        line-height: 1.15;
      }
      #power-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      #power-text {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: #cfd6dc;
      }
      #power-bar {
        position: relative;
        height: 10px;
        margin-top: 6px;
        background: #0c0e10;
        border: 1px solid var(--line);
        border-radius: 3px;
        overflow: hidden;
      }
      #power-fill {
        height: 100%;
        background: #4fd16a;
        transition: width 0.3s;
      }
      /* A marker showing how much power the base is drawing. */
      #power-bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--demand, 0%);
        width: 2px;
        background: #fff;
        transition: left 0.3s;
      }
      #power.low #power-fill {
        background: #e8483f;
      }
      #power.low #power-text {
        color: #ff8078;
      }
      #tabs {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 4px;
      }
      #tabs button {
        position: relative;
        padding: 6px 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--muted);
        background: #12161a;
        border: 1px solid var(--line);
        border-radius: 4px 4px 0 0;
        cursor: pointer;
      }
      #tabs button.on {
        color: #fff;
        background: #2b343d;
        border-bottom-color: #2b343d;
      }
      /* A dot on a tab means something behind it is building, or ready to place. */
      #tabs button[data-state='busy']::after,
      #tabs button[data-state='ready']::after {
        content: '';
        position: absolute;
        top: 4px;
        right: 5px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #4f9fff;
      }
      #tabs button[data-state='ready']::after {
        background: #4fd16a;
        box-shadow: 0 0 6px #4fd16a;
      }
      .list[hidden] {
        display: none;
      }
      .list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 6px;
      }
      button {
        font: inherit;
        color: inherit;
      }
      .build {
        position: relative;
        height: 62px;
        padding: 0;
        background: linear-gradient(#2b343d, #1a2026);
        border: 1px solid var(--line);
        border-radius: 5px;
        overflow: hidden;
        cursor: pointer;
      }
      /* The portrait, drawn from the game's own model. */
      .build::before {
        content: '';
        position: absolute;
        inset: 1px 1px 12px;
        background: var(--icon) center / contain no-repeat;
      }
      .build:hover {
        border-color: rgba(255, 255, 255, 0.45);
      }
      .build span {
        position: absolute;
        z-index: 1;
        text-shadow: 0 1px 2px #000, 0 0 3px #000;
      }
      .build .name {
        left: 0;
        right: 0;
        bottom: 0;
        padding: 2px 2px 3px;
        font-size: 9.5px;
        font-weight: 600;
        line-height: 1.15;
        white-space: nowrap;
        background: rgba(8, 10, 12, 0.72);
      }
      .build .cost {
        top: 3px;
        left: 5px;
        font-size: 11.5px;
        font-weight: 650;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      .build .count {
        top: 3px;
        right: 5px;
        font-size: 12px;
        font-weight: 700;
        color: #fff;
      }
      .build[data-state='queued'] {
        border-color: rgba(79, 160, 255, 0.6);
      }
      .build .status {
        left: 0;
        right: 0;
        top: 50%;
        transform: translateY(-70%);
        white-space: nowrap;
        font-size: 12px;
        font-weight: 650;
        color: #fff;
      }
      /* The classic clock wipe, sweeping round as the item builds. */
      .build .clock {
        position: absolute;
        inset: 0;
        z-index: 0;
        display: none;
        text-shadow: none;
        /* Dark where there is still work to do, clearing as it sweeps round. */
        background: conic-gradient(rgba(0, 0, 0, 0) var(--p, 0deg), rgba(4, 8, 12, 0.72) 0);
      }
      .build[data-state='active'] .clock,
      .build[data-state='held'] .clock {
        display: block;
      }
      .build[data-state='active'] .status {
        color: #cfe3ff;
      }
      .build[data-state='held'] {
        border-color: #c9952a;
      }
      .build[data-state='held'] .status {
        color: var(--gold);
      }
      .build[data-state='ready'] {
        border-color: #4fd16a;
        box-shadow: inset 0 0 0 2px rgba(79, 209, 106, 0.55);
        animation: pulse 0.8s infinite alternate;
      }
      .build[data-state='ready'] .status {
        color: #8df0a2;
        font-weight: 650;
      }
      .build.placing {
        animation: none;
        box-shadow: inset 0 0 0 3px #4fd16a;
      }
      .build[data-state='locked'],
      .build[data-state='busy'] {
        cursor: default;
        filter: grayscale(0.9) brightness(0.55);
      }
      .build[data-state='locked']:hover,
      .build[data-state='busy']:hover {
        border-color: var(--line);
      }
      @keyframes pulse {
        to {
          box-shadow: inset 0 0 0 2px rgba(79, 209, 106, 0.1);
        }
      }
      #tools {
        margin-top: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #sell,
      #repair {
        padding: 9px;
        background: #232a31;
        border: 1px solid var(--line);
        border-radius: 5px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      #sell:hover,
      #repair:hover {
        border-color: rgba(255, 255, 255, 0.4);
      }
      #repair.on {
        background: #1f4a2c;
        border-color: #4fd16a;
      }
      #sell.on {
        background: #5a2622;
        border-color: #e8483f;
      }
      #dragbox {
        position: fixed;
        display: none;
        pointer-events: none;
        background: rgba(120, 255, 140, 0.12);
        border: 1px solid rgba(160, 255, 170, 0.9);
      }
      #banner {
        position: fixed;
        display: none;
        left: calc((100vw - var(--sidebar)) / 2);
        top: 34%;
        transform: translate(-50%, -50%);
        padding: 18px 54px;
        font-size: 54px;
        font-weight: 750;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(12, 14, 16, 0.82);
        border: 2px solid currentColor;
        border-radius: 8px;
        pointer-events: none;
      }
      #banner[data-result='won'] {
        color: #7dff8e;
      }
      #banner[data-result='lost'] {
        color: #ff6b61;
      }
      #again {
        position: fixed;
        display: none;
        left: calc((100vw - var(--sidebar)) / 2);
        top: calc(34% + 78px);
        transform: translateX(-50%);
        padding: 10px 26px;
        font-size: 15px;
        font-weight: 600;
        background: #232a31;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 6px;
        cursor: pointer;
      }
      #hint {
        position: fixed;
        left: calc((100vw - var(--sidebar)) / 2);
        bottom: 16px;
        transform: translateX(-50%);
        padding: 8px 16px;
        font-size: 14px;
        white-space: nowrap;
        background: rgba(16, 19, 22, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 6px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="vignette"></div>
    <aside id="sidebar">
      <canvas id="minimap" width="192" height="192"></canvas>
      <div>
        <div class="label">Credits</div>
        <div id="credits">0</div>
      </div>
      <div id="power">
        <div id="power-head">
          <span class="label">Power</span>
          <span id="power-text"></span>
        </div>
        <div id="power-bar"><div id="power-fill"></div></div>
      </div>
      <div>
        <div id="tabs">
          <button data-tab="structures">Structures</button>
          <button data-tab="infantry">Infantry</button>
          <button data-tab="vehicle">Vehicles</button>
        </div>
        <div id="structures" class="list"></div>
        <div id="infantry" class="list"></div>
        <div id="vehicle" class="list"></div>
      </div>
      <div id="tools">
        <button id="repair">Repair</button>
        <button id="sell">Sell</button>
      </div>
    </aside>
    <div id="dragbox"></div>
    <div id="banner"></div>
    <button id="again">Play again</button>
    <div id="hint"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
